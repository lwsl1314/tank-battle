<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #eee;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 8px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            font-size: 28px;
        }

        #gameInfo {
            display: flex;
            gap: 30px;
            margin-bottom: 8px;
            font-size: 16px;
            background: rgba(233, 69, 96, 0.1);
            padding: 6px 24px;
            border-radius: 20px;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }

        #gameInfo span {
            color: #ffd700;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid #e94560;
            background: #0f0f23;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.25);
        }

        #controls {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        #controls p {
            margin: 3px 0;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a2e;
            padding: 40px 50px;
            border: 2px solid #e94560;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.3);
        }

        .modal h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 32px;
        }

        .modal p {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ccc;
        }

        .modal .big {
            font-size: 36px;
            color: #ffd700;
            margin: 15px 0;
        }

        .btn {
            padding: 12px 36px;
            font-size: 18px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            font-family: inherit;
        }

        .btn:hover {
            background: #ff6b6b;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        #levelMsg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            display: none;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>🔥 坦克大战 🔥</h1>
    <div id="gameInfo">
        <div>生命: <span id="lives">❤️❤️❤️</span></div>
        <div>分数: <span id="score">0</span></div>
        <div>关卡: <span id="level">1</span></div>
        <div>剩余敌人: <span id="remain">10</span></div>
    </div>
    <canvas id="gameCanvas" width="780" height="572"></canvas>
    <div id="controls">
        <p>⬆️⬇️⬅️➡️ 移动 | 空格键 射击</p>
        <p>消灭所有敌方坦克进入下一关！保护基地（金色星星）！</p>
    </div>

    <div id="startScreen" class="overlay active">
        <div class="modal">
            <h2>🎮 坦克大战</h2>
            <p style="color:#aaa;">经典街机游戏重现</p>
            <p style="color:#ffd700; font-size:14px; margin-top:10px;">
                ⬆️⬇️⬅️➡️ 移动坦克<br>
                空格键 发射炮弹
            </p>
            <button class="btn" id="startBtn">开始游戏</button>
        </div>
    </div>

    <div id="gameOver" class="overlay">
        <div class="modal">
            <h2>游戏结束</h2>
            <p>最终分数</p>
            <p class="big" id="finalScore">0</p>
            <button class="btn" id="restartBtn">重新开始</button>
        </div>
    </div>

    <div id="levelMsg"></div>

    <script>
        // ==================== 游戏配置 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const TILE = 26;
        const COLS = 30;
        const ROWS = 22;

        // 方向常量
        const DIR = { UP: 0, DOWN: 1, LEFT: 2, RIGHT: 3 };
        const DIR_VEC = [
            { x: 0, y: -1 },   // UP
            { x: 0, y: 1 },    // DOWN
            { x: -1, y: 0 },   // LEFT
            { x: 1, y: 0 }     // RIGHT
        ];

        // 地图瓦片类型
        const TILE_EMPTY = 0;
        const TILE_BRICK = 1;
        const TILE_STEEL = 2;
        const TILE_WATER = 3;
        const TILE_BASE = 4;

        // ==================== 游戏状态 ====================
        let map = [];
        let player = null;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let enemySpawnTimer = 0;
        let enemiesSpawned = 0;
        let enemiesKilled = 0;
        let totalEnemies = 10;
        let maxEnemiesOnScreen = 4;
        let baseDestroyed = false;
        let keys = {};
        let lastTime = 0;

        // ==================== 辅助函数 ====================
        function rectOverlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
        }

        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randInt(min, max) {
            return Math.floor(rand(min, max));
        }

        // ==================== 地图生成 ====================
        function createMap() {
            map = [];
            for (let r = 0; r < ROWS; r++) {
                map[r] = [];
                for (let c = 0; c < COLS; c++) {
                    map[r][c] = TILE_EMPTY;
                }
            }

            // 生成基地（底部中间）
            const bc = Math.floor(COLS / 2);
            const br = ROWS - 3;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const rr = br + dr, cc = bc + dc;
                    if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
                        map[rr][cc] = (dr === 0 && dc === 0) ? TILE_BASE : TILE_BRICK;
                    }
                }
            }

            // 随机生成障碍物（避开关键区域）
            for (let r = 2; r < ROWS - 2; r++) {
                for (let c = 2; c < COLS - 2; c++) {
                    // 跳过基地附近
                    if (Math.abs(r - br) <= 2 && Math.abs(c - bc) <= 2) continue;
                    // 跳过玩家出生区
                    if (r > ROWS - 6 && Math.abs(c - bc) <= 3) continue;
                    // 跳过敌方出生区
                    if (r < 5 && (c < 7 || c > COLS - 8)) continue;

                    const rnd = Math.random();
                    if (rnd < 0.10) map[r][c] = TILE_BRICK;
                    else if (rnd < 0.13) map[r][c] = TILE_STEEL;
                    else if (rnd < 0.155) map[r][c] = TILE_WATER;
                }
            }
        }

        function getTile(x, y) {
            const c = Math.floor(x / TILE);
            const r = Math.floor(y / TILE);
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return TILE_STEEL;
            return map[r][c];
        }

        function setTile(x, y, type) {
            const c = Math.floor(x / TILE);
            const r = Math.floor(y / TILE);
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                map[r][c] = type;
            }
        }

        // ==================== 坦克类 ====================
        class Tank {
            constructor(x, y, isPlayer) {
                this.x = x;
                this.y = y;
                this.w = 24;
                this.h = 24;
                this.dir = isPlayer ? DIR.UP : DIR.DOWN;
                this.speed = isPlayer ? 2.5 : (1.2 + level * 0.15);
                this.isPlayer = isPlayer;
                this.shootCd = 0;
                this.maxShootCd = isPlayer ? 12 : Math.max(20, 50 - level * 3);
                this.moving = false;
                this.anim = 0;
                this.dead = false;
                this.invincible = isPlayer ? 120 : 0; // 出生无敌时间
            }

            getRect() {
                return { x: this.x, y: this.y, w: this.w, h: this.h };
            }

            canMoveTo(nx, ny) {
                // 边界检查
                if (nx < 0 || nx + this.w > COLS * TILE || ny < 0 || ny + this.h > ROWS * TILE) {
                    return false;
                }

                // 地图碰撞（检查四个角和中心）
                const points = [
                    [nx + 2, ny + 2],
                    [nx + this.w - 2, ny + 2],
                    [nx + 2, ny + this.h - 2],
                    [nx + this.w - 2, ny + this.h - 2],
                    [nx + this.w / 2, ny + 2],
                    [nx + this.w / 2, ny + this.h - 2],
                    [nx + 2, ny + this.h / 2],
                    [nx + this.w - 2, ny + this.h / 2]
                ];

                for (const [px, py] of points) {
                    const tile = getTile(px, py);
                    if (tile === TILE_BRICK || tile === TILE_STEEL || tile === TILE_BASE) {
                        return false;
                    }
                }

                // 与其他坦克碰撞
                const myRect = { x: nx, y: ny, w: this.w, h: this.h };

                if (this.isPlayer) {
                    for (const e of enemies) {
                        if (!e.dead && rectOverlap(myRect, e.getRect())) return false;
                    }
                } else {
                    if (player && !player.dead && rectOverlap(myRect, player.getRect())) return false;
                    for (const e of enemies) {
                        if (e !== this && !e.dead && rectOverlap(myRect, e.getRect())) return false;
                    }
                }

                return true;
            }

            move(dir) {
                if (this.dead) return;
                this.dir = dir;
                this.moving = true;
                this.anim++;

                const vec = DIR_VEC[dir];
                const nx = this.x + vec.x * this.speed;
                const ny = this.y + vec.y * this.speed;

                if (this.canMoveTo(nx, ny)) {
                    this.x = nx;
                    this.y = ny;
                }
            }

            shoot() {
                if (this.dead || this.shootCd > 0) return;
                this.shootCd = this.maxShootCd;

                const vec = DIR_VEC[this.dir];
                const bx = this.x + this.w / 2 - 3 + vec.x * 16;
                const by = this.y + this.h / 2 - 3 + vec.y * 16;

                bullets.push(new Bullet(bx, by, vec.x * 5, vec.y * 5, this.isPlayer));
            }

            update() {
                if (this.shootCd > 0) this.shootCd--;
                if (this.invincible > 0) this.invincible--;
                this.moving = false;
            }

            draw() {
                if (this.dead) return;

                ctx.save();
                const cx = this.x + this.w / 2;
                const cy = this.y + this.h / 2;
                ctx.translate(cx, cy);

                // 无敌闪烁
                if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                // 车身
                ctx.fillStyle = this.isPlayer ? '#22c55e' : '#e11d48';
                ctx.fillRect(-10, -10, 20, 20);

                // 履带
                ctx.fillStyle = this.isPlayer ? '#16a34a' : '#be123c';
                const offset = Math.floor(this.anim / 4) % 2;
                if (this.dir === DIR.UP || this.dir === DIR.DOWN) {
                    ctx.fillRect(-12, -10 + offset, 3, 20);
                    ctx.fillRect(9, -10 + offset, 3, 20);
                } else {
                    ctx.fillRect(-10 + offset, -12, 20, 3);
                    ctx.fillRect(-10 + offset, 9, 20, 3);
                }

                // 炮塔
                ctx.fillStyle = this.isPlayer ? '#86efac' : '#fca5a5';
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();

                // 炮管
                ctx.fillStyle = this.isPlayer ? '#dcfce7' : '#fee2e2';
                ctx.save();
                ctx.rotate(this.dir * Math.PI / 2);
                ctx.fillRect(-2, -15, 4, 11);
                ctx.restore();

                ctx.restore();
            }
        }

        // ==================== 子弹类 ====================
        class Bullet {
            constructor(x, y, dx, dy, isPlayer) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.w = 5;
                this.h = 5;
                this.isPlayer = isPlayer;
                this.dead = false;
            }

            getRect() {
                return { x: this.x, y: this.y, w: this.w, h: this.h };
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;

                // 出界
                if (this.x < 0 || this.x > COLS * TILE || this.y < 0 || this.y > ROWS * TILE) {
                    this.dead = true;
                    return;
                }

                // 地图碰撞
                const cx = this.x + this.w / 2;
                const cy = this.y + this.h / 2;
                const tile = getTile(cx, cy);

                if (tile === TILE_BRICK) {
                    setTile(cx, cy, TILE_EMPTY);
                    createExplosion(cx, cy, '#a0522d', 8);
                    this.dead = true;
                    return;
                }
                if (tile === TILE_STEEL) {
                    createExplosion(cx, cy, '#708090', 5);
                    this.dead = true;
                    return;
                }
                if (tile === TILE_BASE) {
                    setTile(cx, cy, TILE_EMPTY);
                    baseDestroyed = true;
                    createExplosion(cx, cy, '#ff0000', 25);
                    this.dead = true;
                    return;
                }

                // 坦克碰撞
                if (this.isPlayer) {
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        const e = enemies[i];
                        if (!e.dead && rectOverlap(this.getRect(), e.getRect())) {
                            createExplosion(e.x + e.w / 2, e.y + e.h / 2, '#e11d48', 15);
                            e.dead = true;
                            score += 100;
                            enemiesKilled++;
                            this.dead = true;
                            updateUI();
                            return;
                        }
                    }
                } else {
                    if (player && !player.dead && player.invincible <= 0 &&
                        rectOverlap(this.getRect(), player.getRect())) {
                        createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#22c55e', 15);
                        player.dead = true;
                        lives--;
                        updateUI();
                        this.dead = true;

                        if (lives > 0) {
                            setTimeout(() => respawnPlayer(), 1000);
                        } else {
                            setTimeout(() => gameOver(), 1000);
                        }
                        return;
                    }
                }
            }

            draw() {
                ctx.fillStyle = this.isPlayer ? '#fbbf24' : '#f87171';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 1, this.y + 1, 2, 2);
            }
        }

        // ==================== 粒子效果 ====================
        class Particle {
            constructor(x, y, color, speed) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.life = 25;
                this.size = Math.random() * 5 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                this.size *= 0.94;
                return this.life > 0;
            }

            draw() {
                ctx.globalAlpha = this.life / 25;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 5));
            }
        }

        // ==================== 绘制 ====================
        function drawMap() {
            // 背景
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * TILE;
                    const y = r * TILE;
                    const t = map[r][c];

                    switch (t) {
                        case TILE_BRICK:
                            ctx.fillStyle = '#8B4513';
                            ctx.fillRect(x, y, TILE, TILE);
                            ctx.fillStyle = '#A0522D';
                            ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
                            ctx.strokeStyle = '#654321';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
                            break;
                        case TILE_STEEL:
                            ctx.fillStyle = '#4a5568';
                            ctx.fillRect(x, y, TILE, TILE);
                            ctx.fillStyle = '#718096';
                            ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
                            ctx.strokeStyle = '#2d3748';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(x + 4, y + 4, TILE - 8, TILE - 8);
                            break;
                        case TILE_WATER:
                            ctx.fillStyle = '#1e3a5f';
                            ctx.fillRect(x, y, TILE, TILE);
                            ctx.fillStyle = '#2d5a87';
                            const wave = Math.floor(Date.now() / 500) % 2;
                            ctx.fillRect(x + 3 + wave, y + 8, TILE - 6, 3);
                            ctx.fillRect(x + 6 - wave, y + 16, TILE - 9, 2);
                            break;
                        case TILE_BASE:
                            ctx.fillStyle = '#b45309';
                            ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
                            ctx.fillStyle = '#f59e0b';
                            ctx.beginPath();
                            const sx = x + TILE / 2;
                            const sy = y + TILE / 2;
                            for (let i = 0; i < 5; i++) {
                                const angle = (i * 144 - 90) * Math.PI / 180;
                                const px = sx + Math.cos(angle) * 8;
                                const py = sy + Math.sin(angle) * 8;
                                if (i === 0) ctx.moveTo(px, py);
                                else ctx.lineTo(px, py);
                            }
                            ctx.closePath();
                            ctx.fill();
                            break;
                    }
                }
            }

            // 外边框
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, COLS * TILE, ROWS * TILE);
        }

        // ==================== 敌方AI ====================
        function updateEnemies() {
            // 清理死亡敌人
            enemies = enemies.filter(e => !e.dead);

            // 生成新敌人
            enemySpawnTimer++;
            const spawnInterval = Math.max(60, 150 - level * 8);
            if (enemySpawnTimer >= spawnInterval && enemies.length < maxEnemiesOnScreen &&
                enemiesSpawned < totalEnemies) {
                enemySpawnTimer = 0;
                enemiesSpawned++;

                const side = Math.random() > 0.5 ? 0 : 1;
                const ex = side === 0 ? 2 * TILE : (COLS - 3) * TILE;
                const ey = 2 * TILE;
                enemies.push(new Tank(ex, ey, false));
            }

            for (const e of enemies) {
                if (e.dead) continue;

                // AI决策
                if (Math.random() < 0.02) {
                    e.dir = randInt(0, 4);
                }

                // 追踪玩家
                if (player && !player.dead && Math.random() < 0.35) {
                    const dx = player.x - e.x;
                    const dy = player.y - e.y;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        e.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
                    } else {
                        e.dir = dy > 0 ? DIR.DOWN : DIR.UP;
                    }
                }

                e.move(e.dir);

                // 射击
                if (Math.random() < 0.015 + level * 0.003) {
                    e.shoot();
                }

                e.update();
            }
        }

        // ==================== 输入处理 ====================
        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        function handleInput() {
            if (!player || player.dead) return;

            let moved = false;

            // 支持方向键和 WASD
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                player.move(DIR.UP);
                moved = true;
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                player.move(DIR.DOWN);
                moved = true;
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.move(DIR.LEFT);
                moved = true;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.move(DIR.RIGHT);
                moved = true;
            }

            if (keys[' '] || keys['Enter']) {
                player.shoot();
            }

            return moved;
        }

        // ==================== UI更新 ====================
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('remain').textContent = Math.max(0, totalEnemies - enemiesKilled);
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            document.getElementById('lives').textContent = hearts || '💔';
        }

        function showLevelMsg(text) {
            const el = document.getElementById('levelMsg');
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 1500);
        }

        // ==================== 游戏流程 ====================
        function respawnPlayer() {
            if (!gameRunning) return;
            player = new Tank(Math.floor(COLS / 2) * TILE - 12, (ROWS - 3) * TILE - 12, true);
        }

        function checkWinCondition() {
            if (enemiesKilled >= totalEnemies && enemies.length === 0) {
                level++;
                showLevelMsg(`第 ${level} 关`);
                enemiesSpawned = 0;
                enemiesKilled = 0;
                totalEnemies += 5;
                maxEnemiesOnScreen = Math.min(4 + Math.floor(level / 2), 8);
                bullets = [];
                createMap();
                if (player) {
                    player.x = Math.floor(COLS / 2) * TILE - 12;
                    player.y = (ROWS - 3) * TILE - 12;
                    player.invincible = 120;
                }
                updateUI();
            }
        }

        function checkGameOver() {
            if (baseDestroyed) {
                lives = 0;
                updateUI();
                gameOver();
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').classList.add('active');
        }

        // ==================== 主循环 ====================
        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            // 更新
            handleInput();
            if (player && !player.dead) player.update();
            updateEnemies();

            // 子弹
            for (const b of bullets) b.update();
            bullets = bullets.filter(b => !b.dead);

            // 粒子
            for (const p of particles) p.update();
            particles = particles.filter(p => p.life > 0);

            checkWinCondition();
            checkGameOver();

            // 绘制
            drawMap();

            if (player && !player.dead) player.draw();
            for (const e of enemies) e.draw();
            for (const b of bullets) b.draw();
            for (const p of particles) p.draw();

            requestAnimationFrame(gameLoop);
        }

        // ==================== 初始化 ====================
        function initGame() {
            score = 0;
            lives = 3;
            level = 1;
            enemiesSpawned = 0;
            enemiesKilled = 0;
            totalEnemies = 10;
            maxEnemiesOnScreen = 4;
            baseDestroyed = false;
            enemies = [];
            bullets = [];
            particles = [];
            createMap();
            player = new Tank(Math.floor(COLS / 2) * TILE - 12, (ROWS - 3) * TILE - 12, true);
            updateUI();
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').classList.remove('active');
            initGame();
            gameRunning = true;
            lastTime = performance.now();
            showLevelMsg('第 1 关');
            requestAnimationFrame(gameLoop);
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOver').classList.remove('active');
            initGame();
            gameRunning = true;
            lastTime = performance.now();
            showLevelMsg('第 1 关');
            requestAnimationFrame(gameLoop);
        });

        // 初始画面
        drawMap();
    </script>
</body>
</html>
