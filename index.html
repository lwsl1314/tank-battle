<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #eee;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        h1 { color: #e94560; margin-bottom: 8px; font-size: 26px; }
        #info {
            display: flex;
            gap: 25px;
            margin-bottom: 6px;
            font-size: 15px;
            background: rgba(233,69,96,0.1);
            padding: 5px 20px;
            border-radius: 16px;
        }
        #info span { color: #ffd700; font-weight: bold; }
        canvas {
            border: 3px solid #e94560;
            background: #0a0a1a;
        }
        #tip {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .box {
            background: #1a1a2e;
            padding: 35px 50px;
            border: 2px solid #e94560;
            border-radius: 10px;
            text-align: center;
        }
        .box h2 { color: #e94560; margin-bottom: 12px; font-size: 28px; }
        .box p { color: #aaa; margin: 6px 0; font-size: 15px; }
        .box .score { color: #ffd700; font-size: 32px; margin: 10px 0; }
        .btn {
            padding: 10px 30px;
            font-size: 17px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn:hover { background: #ff6b6b; }
        #levelTip {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            font-size: 44px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.6);
            display: none;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>
    <h1>🔥 坦克大战</h1>
    <div id="info">
        <div>生命: <span id="lives">❤️❤️❤️</span></div>
        <div>分数: <span id="score">0</span></div>
        <div>关卡: <span id="level">1</span></div>
        <div>剩余: <span id="remain">10</span></div>
    </div>
    <canvas id="cvs" width="780" height="572"></canvas>
    <div id="tip">⬆️⬇️⬅️➡️ 或 WASD 移动 | 空格 射击</div>

    <div id="start" class="modal">
        <div class="box">
            <h2>🎮 坦克大战</h2>
            <p>方向键 / WASD 移动坦克</p>
            <p>空格键 发射炮弹</p>
            <p>消灭敌人，保护基地！</p>
            <button class="btn" id="startBtn">开始游戏</button>
        </div>
    </div>

    <div id="over" class="modal hidden">
        <div class="box">
            <h2>游戏结束</h2>
            <p>最终分数</p>
            <p class="score" id="finalScore">0</p>
            <button class="btn" id="restartBtn">重新开始</button>
        </div>
    </div>

    <div id="levelTip"></div>

<script>
// ==================== 常量 ====================
const canvas = document.getElementById('cvs');
const ctx = canvas.getContext('2d');
const TW = 26;              // 瓦片宽度
const TH = 26;              // 瓦片高度
const CW = 30;              // 列数
const CH = 22;              // 行数
const UP=0, DOWN=1, LEFT=2, RIGHT=3;

// ==================== 游戏状态 ====================
let map = [];               // 0空地 1砖墙 2铁墙 3水 4基地
let player = null;
let enemies = [];
let bullets = [];
let particles = [];
let score = 0, lives = 3, level = 1;
let gameRunning = false;
let spawnTimer = 0, spawned = 0, killed = 0, total = 10;
let maxOnScreen = 4;
let keys = {};

// ==================== 工具函数 ====================
function overlap(a, b) {
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function tileAt(px, py) {
    const c = Math.floor(px / TW), r = Math.floor(py / TH);
    if (r < 0 || r >= CH || c < 0 || c >= CW) return 1;
    return map[r] ? map[r][c] : 1;
}
function setTile(px, py, v) {
    const c = Math.floor(px / TW), r = Math.floor(py / TH);
    if (r >= 0 && r < CH && c >= 0 && c < CW) map[r][c] = v;
}

// ==================== 生成地图 ====================
function makeMap() {
    // 全空地
    map = Array(CH).fill(0).map(() => Array(CW).fill(0));

    // 基地：底部中间 3x3 区域，中心是基地，周围砖墙
    const bx = Math.floor(CW/2);    // 15
    const by = CH - 2;               // 20
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const rr = by + dy, cc = bx + dx;
            if (rr >= 0 && rr < CH && cc >= 0 && cc < CW) {
                map[rr][cc] = (dy===0 && dx===0) ? 4 : 1;
            }
        }
    }

    // 随机障碍（避开出生区和基地）
    for (let r = 3; r < CH - 5; r++) {
        for (let c = 2; c < CW - 2; c++) {
            if (Math.abs(r-by) <= 3 && Math.abs(c-bx) <= 3) continue; // 基地附近
            const rnd = Math.random();
            if (rnd < 0.10) map[r][c] = 1;      // 砖墙
            else if (rnd < 0.13) map[r][c] = 2; // 铁墙
            else if (rnd < 0.155) map[r][c] = 3; // 水
        }
    }
}

// ==================== 坦克 ====================
class Tank {
    constructor(x, y, isPlayer) {
        this.x = x; this.y = y;
        this.w = 24; this.h = 24;
        this.dir = isPlayer ? UP : DOWN;
        this.speed = isPlayer ? 2.5 : (1.2 + level*0.15);
        this.isPlayer = isPlayer;
        this.shootCD = 0;
        this.maxCD = isPlayer ? 12 : Math.max(20, 48-level*3);
        this.moving = false;
        this.anim = 0;
        this.dead = false;
        this.inv = isPlayer ? 100 : 0; // 无敌帧
    }
    rect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }

    // 检查位置是否可通行
    free(nx, ny) {
        // 画布边界
        if (nx < 2 || nx + this.w > CW*TW - 2 || ny < 2 || ny + this.h > CH*TH - 2) return false;

        // 取坦克覆盖的所有格子检查
        const c1 = Math.floor((nx+2)/TW), r1 = Math.floor((ny+2)/TH);
        const c2 = Math.floor((nx+this.w-2)/TW), r2 = Math.floor((ny+this.h-2)/TH);
        for (let r = r1; r <= r2; r++) {
            for (let c = c1; c <= c2; c++) {
                if (r < 0 || r >= CH || c < 0 || c >= CW) return false;
                const t = map[r][c];
                if (t === 1 || t === 2 || t === 4) return false;
            }
        }

        // 与其他坦克碰撞
        const rc = {x:nx, y:ny, w:this.w, h:this.h};
        if (this.isPlayer) {
            for (const e of enemies) if (!e.dead && overlap(rc, e.rect())) return false;
        } else {
            if (player && !player.dead && overlap(rc, player.rect())) return false;
            for (const e of enemies) if (e !== this && !e.dead && overlap(rc, e.rect())) return false;
        }
        return true;
    }

    move(dir) {
        if (this.dead) return;
        this.dir = dir;
        this.moving = true;
        this.anim++;

        const spd = this.speed;
        let nx = this.x, ny = this.y;
        if (dir === UP) ny -= spd;
        else if (dir === DOWN) ny += spd;
        else if (dir === LEFT) nx -= spd;
        else if (dir === RIGHT) nx += spd;

        if (this.free(nx, ny)) {
            this.x = nx;
            this.y = ny;
        } else {
            // 贴墙滑动：尝试单轴移动
            if (dir === UP || dir === DOWN) {
                // 尝试只移X（已在正确X，不需要）
            } else {
                // 尝试只移Y（已在正确Y，不需要）
            }
        }
    }

    shoot() {
        if (this.dead || this.shootCD > 0) return;
        this.shootCD = this.maxCD;
        let bx = this.x + this.w/2 - 2;
        let by = this.y + this.h/2 - 2;
        let vx = 0, vy = 0;
        if (this.dir === UP)    { vy = -5; by = this.y - 5; }
        if (this.dir === DOWN)  { vy = 5;  by = this.y + this.h; }
        if (this.dir === LEFT)  { vx = -5; bx = this.x - 5; }
        if (this.dir === RIGHT) { vx = 5;  bx = this.x + this.w; }
        bullets.push(new Bullet(bx, by, vx, vy, this.isPlayer));
    }

    update() {
        if (this.shootCD > 0) this.shootCD--;
        if (this.inv > 0) this.inv--;
        this.moving = false;
    }

    draw() {
        if (this.dead) return;
        ctx.save();
        const cx = this.x + this.w/2, cy = this.y + this.h/2;
        ctx.translate(cx, cy);
        if (this.inv > 0 && Math.floor(this.inv/5)%2 === 0) ctx.globalAlpha = 0.4;

        // 车身
        ctx.fillStyle = this.isPlayer ? '#22c55e' : '#e11d48';
        ctx.fillRect(-10, -10, 20, 20);

        // 履带
        ctx.fillStyle = this.isPlayer ? '#16a34a' : '#be123c';
        const o = Math.floor(this.anim/4) % 2;
        if (this.dir === UP || this.dir === DOWN) {
            ctx.fillRect(-12, -10+o, 3, 20);
            ctx.fillRect(9, -10+o, 3, 20);
        } else {
            ctx.fillRect(-10+o, -12, 20, 3);
            ctx.fillRect(-10+o, 9, 20, 3);
        }

        // 炮塔
        ctx.fillStyle = this.isPlayer ? '#86efac' : '#fca5a5';
        ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();

        // 炮管
        ctx.fillStyle = this.isPlayer ? '#dcfce7' : '#fee2e2';
        ctx.save();
        ctx.rotate(this.dir * Math.PI/2);
        ctx.fillRect(-2, -15, 4, 11);
        ctx.restore();

        ctx.restore();
    }
}

// ==================== 子弹 ====================
class Bullet {
    constructor(x, y, vx, vy, isPlayer) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.w = 4; this.h = 4;
        this.isPlayer = isPlayer;
        this.dead = false;
    }
    rect() { return {x:this.x,y:this.y,w:this.w,h:this.h}; }

    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > CW*TW || this.y < 0 || this.y > CH*TH) {
            this.dead = true; return;
        }
        const cx = this.x + this.w/2, cy = this.y + this.h/2;
        const t = tileAt(cx, cy);
        if (t === 1) { setTile(cx,cy,0); boom(cx,cy,'#a0522d',6); this.dead=true; return; }
        if (t === 2) { boom(cx,cy,'#708090',4); this.dead=true; return; }
        if (t === 4) { setTile(cx,cy,0); baseDead(); boom(cx,cy,'#f00',20); this.dead=true; return; }

        if (this.isPlayer) {
            for (let i=enemies.length-1; i>=0; i--) {
                const e = enemies[i];
                if (!e.dead && overlap(this.rect(), e.rect())) {
                    e.dead = true; killed++; score += 100;
                    boom(e.x+e.w/2, e.y+e.h/2, '#e11d48', 12);
                    this.dead = true; updateUI(); return;
                }
            }
        } else {
            if (player && !player.dead && player.inv<=0 && overlap(this.rect(), player.rect())) {
                player.dead = true; lives--;
                boom(player.x+player.w/2, player.y+player.h/2, '#22c55e', 12);
                this.dead = true; updateUI();
                if (lives > 0) setTimeout(spawnPlayer, 800);
                else setTimeout(gameOver, 800);
                return;
            }
        }
    }

    draw() {
        ctx.fillStyle = this.isPlayer ? '#fbbf24' : '#f87171';
        ctx.fillRect(this.x, this.y, this.w+1, this.h+1);
    }
}

// ==================== 粒子 ====================
class Particle {
    constructor(x,y,color,spd) {
        this.x=x; this.y=y; this.color=color;
        this.vx=(Math.random()-0.5)*spd; this.vy=(Math.random()-0.5)*spd;
        this.life=20; this.sz=Math.random()*4+2;
    }
    update() { this.x+=this.vx; this.y+=this.vy; this.life--; this.sz*=0.93; return this.life>0; }
    draw() { ctx.globalAlpha=this.life/20; ctx.fillStyle=this.color; ctx.fillRect(this.x,this.y,this.sz,this.sz); ctx.globalAlpha=1; }
}
function boom(x,y,color,n) { for(let i=0;i<n;i++) particles.push(new Particle(x,y,color,4)); }

// ==================== 绘制 ====================
function drawMap() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for (let r=0; r<CH; r++) {
        for (let c=0; c<CW; c++) {
            const x=c*TW, y=r*TH, t=map[r][c];
            if (t===1) {
                ctx.fillStyle='#8B4513'; ctx.fillRect(x,y,TW,TH);
                ctx.fillStyle='#A0522D'; ctx.fillRect(x+2,y+2,TW-4,TH-4);
            } else if (t===2) {
                ctx.fillStyle='#4a5568'; ctx.fillRect(x,y,TW,TH);
                ctx.fillStyle='#718096'; ctx.fillRect(x+2,y+2,TW-4,TH-4);
                ctx.strokeStyle='#2d3748'; ctx.strokeRect(x+4,y+4,TW-8,TH-8);
            } else if (t===3) {
                ctx.fillStyle='#1e3a5f'; ctx.fillRect(x,y,TW,TH);
                ctx.fillStyle='#2d5a87';
                const w=Math.floor(Date.now()/400)%2;
                ctx.fillRect(x+3+w,y+8,TW-6,3);
            } else if (t===4) {
                ctx.fillStyle='#b45309'; ctx.fillRect(x+1,y+1,TW-2,TH-2);
                ctx.fillStyle='#f59e0b';
                ctx.font='bold 14px Arial'; ctx.textAlign='center';
                ctx.fillText('★',x+TW/2,y+TH/2+5);
            }
        }
    }
    // 外框
    ctx.strokeStyle='#e94560'; ctx.lineWidth=2;
    ctx.strokeRect(0,0,CW*TW,CH*TH);
}

// ==================== 敌人AI ====================
function updateEnemies() {
    enemies = enemies.filter(e => !e.dead);

    spawnTimer++;
    const interval = Math.max(50, 130-level*6);
    if (spawnTimer >= interval && enemies.length < maxOnScreen && spawned < total) {
        spawnTimer = 0; spawned++;
        const side = Math.random()>0.5 ? 0 : 1;
        const ex = (side===0 ? 2 : CW-4) * TW + 2;
        const ey = 2 * TW + 2;
        enemies.push(new Tank(ex, ey, false));
    }

    for (const e of enemies) {
        if (e.dead) continue;
        if (Math.random() < 0.025) e.dir = Math.floor(Math.random()*4);
        if (player && !player.dead && Math.random() < 0.35) {
            const dx = player.x - e.x, dy = player.y - e.y;
            e.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?RIGHT:LEFT) : (dy>0?DOWN:UP);
        }
        e.move(e.dir);
        if (Math.random() < 0.012 + level*0.002) e.shoot();
        e.update();
    }
}

// ==================== 输入 ====================
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(e.key))
        e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function handleInput() {
    if (!player || player.dead) return;
    let moving = false;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) { player.move(UP); moving=true; }
    if (keys['ArrowDown'] || keys['s'] || keys['S']) { player.move(DOWN); moving=true; }
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.move(LEFT); moving=true; }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.move(RIGHT); moving=true; }
    if (keys[' '] || keys['Enter']) { player.shoot(); }
    return moving;
}

// ==================== UI ====================
function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    document.getElementById('remain').textContent = Math.max(0, total-killed);
    let h = ''; for(let i=0;i<lives;i++) h+='❤️';
    document.getElementById('lives').textContent = h || '💔';
}
function showTip(txt) {
    const el = document.getElementById('levelTip');
    el.textContent = txt; el.style.display = 'block';
    setTimeout(()=>el.style.display='none', 1200);
}

// ==================== 游戏流程 ====================
function spawnPlayer() {
    if (!gameRunning) return;
    // 出生在底部中间，基地上方 4 格处
    player = new Tank(Math.floor(CW/2)*TW + 1, (CH-6)*TW + 1, true);
}

function baseDead() {
    lives = 0; updateUI(); gameOver();
}
function gameOver() {
    gameRunning = false;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('over').classList.remove('hidden');
}

function checkLevel() {
    if (killed >= total && enemies.length === 0) {
        level++; showTip('第 '+level+' 关');
        spawned = 0; killed = 0; total += 4;
        maxOnScreen = Math.min(4 + Math.floor(level/2), 8);
        bullets = []; makeMap();
        if (player) { player.x = Math.floor(CW/2)*TW+1; player.y = (CH-6)*TW+1; player.inv=100; }
        updateUI();
    }
}

// ==================== 主循环 ====================
function loop() {
    if (!gameRunning) return;

    handleInput();
    if (player && !player.dead) player.update();
    updateEnemies();

    for (const b of bullets) b.update();
    bullets = bullets.filter(b => !b.dead);

    for (const p of particles) p.update();
    particles = particles.filter(p => p.life > 0);

    checkLevel();

    drawMap();
    if (player && !player.dead) player.draw();
    for (const e of enemies) e.draw();
    for (const b of bullets) b.draw();
    for (const p of particles) p.draw();

    requestAnimationFrame(loop);
}

// ==================== 初始化 ====================
function reset() {
    score = 0; lives = 3; level = 1;
    spawned = 0; killed = 0; total = 10;
    maxOnScreen = 4;
    enemies = []; bullets = []; particles = [];
    makeMap();
    spawnPlayer();
    updateUI();
}

document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('start').classList.add('hidden');
    reset(); gameRunning = true;
    showTip('第 1 关');
    requestAnimationFrame(loop);
});

document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('over').classList.add('hidden');
    reset(); gameRunning = true;
    showTip('第 1 关');
    requestAnimationFrame(loop);
});

// 初始画面
drawMap();
</script>
</body>
</html>
